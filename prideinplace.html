<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pride in Place | Balchder Bro</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* Background */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bgmx600.png') repeat-x top center;
            background-size: auto;
            z-index: -1;
        }

        /* Make page fill viewport */
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden; /* removes page scrollbar */
        }

        .wrapper {
            display: flex;
            width: 100%;
            height: 100vh;
            padding: 20px 0;
        }

        .left {
            width: 0;
        }

        .right {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        /* Main container becomes full height */
        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 900px;
            max-width: calc(100% - 40px);

            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        /* Home button */
        .home-button {
            display: inline-block;
            background-color: #72001D;
            color: #fff;
            padding: 10px 20px;
            margin-bottom: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-family: Verdana, sans-serif;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        .home-button:hover {
            background-color: #4F0014;
        }

        h1 {
            font-family: Georgia, serif;
            margin: 5px 0 10px 0;
        }

        /* KEY FIX: iframe fills remaining space */
        .form-frame {
            width: 100%;
            flex: 1;
            border: none;
        }

        #footnote {
            font-size: 10px;
            margin-top: 10px;
            color: #666;
        }

        /* Mobile */
        @media only screen and (max-width: 720px) {
            body {
                overflow: auto; /* allow scroll on small screens */
            }

            .wrapper {
                height: auto;
                padding: 10px;
            }

            .form-container {
                height: auto;
            }

            .form-frame {
                height: 80vh;
                flex: none;
            }
        }
    </style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

    <div class="left"></div>

    <div class="right">

        <div class="form-container">

            <a href="index.html" class="home-button">
                Home | Hafan
            </a>

            <h1>Pride in Place | Balchder Bro</h1>

            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSdTRrtg1C_Si7sQ-ONP8H-LhaOV8IcbtyRLlLpXfl1SQB2K7w/viewform?embedded=true"
                class="form-frame">
            </iframe>

            <p id="footnote">
                Promoted by Alex Barros-Curtis at Transport House, 1 Cathedral Road,
                Riverside, Cardiff, CF11 9SD.
            </p>

        </div>

    </div>

</div>

</body>
</html>
