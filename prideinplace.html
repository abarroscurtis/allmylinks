<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pride in Place | Balchder Bro</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* FIX BACKGROUND */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bgmx600.png') repeat-x top center;
            z-index: -1;
        }

        /* IMPORTANT: prevents overflow everywhere  */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Desktop layout */
        .wrapper {
            display: flex;
            width: 100%;
            padding: 50px 0;
        }

        .left {
            width: 0;
        }

        .right {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Form container */
        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 900px;
            max-width: calc(100% - 40px);
        }

        /* Button */
        .home-button {
            display: inline-block;
            background-color: #72001D;
            color: #fff;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-decoration: none;
            font-family: Verdana, sans-serif;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .home-button:hover {
            background-color: #4F0014;
        }

        .form-frame {
            width: 100%;
            height: 1200px;
            border: none;
        }

        h1 {
            font-family: Georgia, serif;
        }

        #footnote {
            font-size: 10px;
            margin-top: 20px;
            color: #666;
        }

        /* =========================
           MOBILE + TABLET FIXES
           ========================= */
        @media only screen and (max-width: 720px) {

            html, body {
                overflow-x: hidden;
            }

            /* REMOVE TOP/BOTTOM GAP COMPLETELY */
            .wrapper {
                padding: 0;
                margin: 0;
            }

            .right {
                width: 100%;
                padding: 0;
                margin: 0;
            }

            .form-container {
                width: 100%;
                max-width: 100%;
                padding: 15px;
                margin: 0;
                border-radius: 0; /* optional: removes side gaps feel */
            }

            .home-button {
                margin-top: 0;
            }

            .form-frame {
                height: 1400px;
            }

            #footnote {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

    <div class="left"></div>

    <div class="right">

        <div class="form-container">

            <a href="index.html" class="home-button">
                Home | Hafan
            </a>

            <h1><center></center>Pride in Place | Balchder Bro</center></h1>

            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSdTRrtg1C_Si7sQ-ONP8H-LhaOV8IcbtyRLlLpXfl1SQB2K7w/viewform?embedded=true"
                class="form-frame">
            </iframe>

            <p id="footnote">
               <center></center> Promoted by Alex Barros-Curtis at Transport House, 1 Cathedral Road,
                Riverside, Cardiff, CF11 9SD.test2</center>
            </p>

        </div>

    </div>

</div>

</body>
</html>
