<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pride in Place | Balchder Bro</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bgmx600.png') repeat-x top center;
            z-index: -1;
        }

        .wrapper {
            display: flex;
            width: 100%;
            padding: 50px 0;
        }

        .left { width: 0; }

        .right {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* KEY FIX: give container a real height */
        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
            width: 900px;
            max-width: calc(100% - 40px);

            height: 800px; /* <-- THIS is what makes 100% work */
            display: flex;
            flex-direction: column;
        }

        .home-button {
            display: inline-block;
            background-color: #72001D;
            color: #fff;
            padding: 10px 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-decoration: none;
            font-family: Verdana, sans-serif;
        }

        h1 {
            font-family: Georgia, serif;
            margin: 5px 0 10px 0;
        }

        /* NOW 100% WORKS */
        .form-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
        }

        #footnote {
            font-size: 10px;
            margin-top: 10px;
            color: #666;
        }

        @media (max-width: 720px) {
            .form-container {
                height: 90vh; /* better on mobile */
            }
        }
    </style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

    <div class="left"></div>

    <div class="right">

        <div class="form-container">

            <a href="index.html" class="home-button">Home | Hafan</a>

            <h1>Pride in Place | Balchder Bro</h1>

            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSdTRrtg1C_Si7sQ-ONP8H-LhaOV8IcbtyRLlLpXfl1SQB2K7w/viewform?embedded=true"
                class="form-frame">
            </iframe>

            <p id="footnote">
                Promoted by Alex Barros-Curtis at Transport House, 1 Cathedral Road,
                Riverside, Cardiff, CF11 9SD.
            </p>

        </div>

    </div>

</div>

</body>
</html>
